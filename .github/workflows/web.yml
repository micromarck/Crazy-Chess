# Builds the web version (WebAssembly + WebGL2) with Trunk and uploads the
# static site as an artifact ("tactics-web"). Unzip it and serve the folder
# with any static web server (opening index.html from disk won't work:
# browsers block wasm/asset loading from file://), e.g.
#   python3 -m http.server -d tactics-web 8080
# Run it from the Actions tab (Run workflow) or by pushing to a listed branch.
#
# It also publishes the site on GitHub Pages (job "pages"). One-time setup in
# the repository: Settings -> Pages -> Build and deployment -> Source:
# "GitHub Actions" (NOT "Deploy from a branch": that publishes the repository
# itself, i.e. the README). The game is then at https://<owner>.github.io/<repo>/
# (the link is shown on each run). Pages deploys only from allowed branches:
# if this branch isn't the default one, add it under Settings ->
# Environments -> github-pages -> Deployment branches.
name: Web (WASM)

on:
  workflow_dispatch:
  push:
    branches: [ccr-bdc572a0-4i31t2, claude/chess-game-html-FlsMY]
    paths: ["crates/**", "Cargo.toml", "Cargo.lock", ".cargo/**", ".github/workflows/web.yml"]

# Publishing to Pages needs these; one deploy at a time, the newest wins.
permissions:
  contents: read
  pages: write
  id-token: write

# Own group name: GitHub's built-in "pages build and deployment" uses "pages".
concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          key: web

      # Prebuilt Trunk; it fetches the matching wasm-bindgen and wasm-opt itself.
      - name: Install Trunk
        run: |
          curl -sSL https://github.com/trunk-rs/trunk/releases/download/v0.21.14/trunk-x86_64-unknown-linux-gnu.tar.gz | tar -xz -C "$HOME/.cargo/bin"
          trunk --version

      - name: Build the site
        working-directory: crates/tactics_game
        # --public-url ./ : relative links, so the folder works from any path
        # (a sub-folder, GitHub Pages, itch.io...).
        run: trunk build --release --public-url ./

      - uses: actions/upload-artifact@v4
        with:
          name: tactics-web
          path: crates/tactics_game/dist
          if-no-files-found: error

      # The same folder, packaged for GitHub Pages.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: crates/tactics_game/dist

  pages:
    needs: web
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
