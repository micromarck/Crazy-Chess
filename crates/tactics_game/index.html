<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>TBSium</title>
    <!-- Installable: "Add to Home Screen" opens it fullscreen, in landscape. -->
    <link rel="manifest" href="web/manifest.webmanifest" />
    <link rel="icon" href="web/icon-192.png" />
    <link rel="apple-touch-icon" href="web/icon-192.png" />
    <meta name="theme-color" content="#0f1217" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="TBSium" />
    <!-- Trunk: build the `tactics_game` binary for wasm32 (wasm-opt shrinks the release output);
         loader.js shows download progress on the loading screen (#tbs-loading). -->
    <link data-trunk rel="rust" data-bin="tactics_game" data-wasm-opt="z" data-initializer="loader.js" />
    <!-- Ship the assets folder alongside the wasm. -->
    <link data-trunk rel="copy-dir" href="assets" />
    <!-- The app manifest and icons. -->
    <link data-trunk rel="copy-dir" href="web" />
    <style>
      html, body { margin: 0; height: 100%; background: #0f1217; overflow: hidden; }
      /* Touchscreens: the game owns every gesture (no browser pinch-zoom,
         double-tap zoom, pull-to-refresh, text selection or long-press menus). */
      html, body {
        position: fixed; inset: 0;
        overscroll-behavior: none; touch-action: none;
        -webkit-user-select: none; user-select: none;
        -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
      }
      /* Portrait phones: ask for landscape (the HUD is laid out for it). */
      #tbs-rotate {
        display: none; position: fixed; inset: 0; z-index: 20;
        flex-direction: column; align-items: center; justify-content: center; gap: 14px;
        background: #0f1217f0; color: #d8dee9; text-align: center; padding: 24px;
        font: 16px/1.4 ui-monospace, "Cascadia Mono", Consolas, monospace;
      }
      #tbs-rotate .phone { width: 46px; height: 80px; border: 3px solid #f0c674; border-radius: 9px; animation: tbs-turn 2s ease-in-out infinite; }
      @keyframes tbs-turn { 0%, 30% { transform: rotate(0deg); } 60%, 100% { transform: rotate(-90deg); } }
      @media (orientation: portrait) and (pointer: coarse) { #tbs-rotate { display: flex; } }
      /* Bevy attaches its <canvas> to <body>; fit_canvas_to_parent makes it fill it. */
      canvas { display: block; width: 100%; height: 100%; outline: none; touch-action: none; }

      /* Loading screen: shown until the game removes it (first mission on screen). */
      #tbs-loading {
        position: fixed; inset: 0; z-index: 10;
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
        background: radial-gradient(ellipse at center, #1b2230 0%, #0f1217 70%);
        color: #d8dee9; font: 15px/1.4 ui-monospace, "Cascadia Mono", Consolas, monospace;
        transition: opacity 0.5s ease;
      }
      #tbs-loading.done { opacity: 0; pointer-events: none; }
      #tbs-loading h1 { margin: 0; font-size: 34px; letter-spacing: 0.35em; color: #f0c674; font-weight: 700; }
      #tbs-loading .sub { margin-top: -10px; color: #7f8a9a; letter-spacing: 0.2em; font-size: 12px; }
      #tbs-loading .track { width: min(420px, 80vw); height: 8px; border-radius: 4px; background: #262d3a; overflow: hidden; }
      #tbs-loading-bar { height: 100%; width: 0; background: linear-gradient(90deg, #4f8fd8, #7fb2ff); transition: width 0.2s; }
      #tbs-loading-bar.indeterminate { width: 30%; animation: tbs-slide 1.2s ease-in-out infinite; }
      @keyframes tbs-slide { from { transform: translateX(-100%); } to { transform: translateX(340%); } }
      #tbs-loading-status { min-height: 1.4em; color: #aab4c3; text-align: center; padding: 0 16px; }
      #tbs-loading .tip { position: absolute; bottom: 28px; color: #5f6a7a; font-size: 12px; text-align: center; padding: 0 16px; }
      #tbs-loading.failed #tbs-loading-status { color: #e06c75; }
      #tbs-loading.failed .track { display: none; }
    </style>
  </head>
  <body>
    <div id="tbs-loading">
      <h1>TBSIUM</h1>
      <div class="sub">TURN-BASED TACTICS</div>
      <div class="track"><div id="tbs-loading-bar"></div></div>
      <div id="tbs-loading-status">Loading...</div>
      <div class="tip">Tip: units at the end of a wall can peek around the corner to see and shoot.</div>
      <noscript>This game needs JavaScript and WebAssembly.</noscript>
    </div>
    <div id="tbs-rotate">
      <div class="phone"></div>
      <div>Turn your device sideways to play.</div>
      <div style="font-size: 13px; color: #8a94a3">Tip: the Full screen button (top left) hides the browser bars.</div>
    </div>
    <script>
      // Right-drag rotates the camera: no browser context menu over the game.
      document.addEventListener("contextmenu", (e) => e.preventDefault());
      // iOS Safari: no page pinch-zoom (it ignores user-scalable=no).
      for (const name of ["gesturestart", "gesturechange", "gestureend"]) {
        document.addEventListener(name, (e) => e.preventDefault());
      }
    </script>
  </body>
</html>
